name: Trigger RDP Tailscale

on:
  workflow_dispatch:
    inputs:
      tailscale_key:
        description: 'Tailscale Auth Key'
        required: true
        type: string
      user:
        description: 'Username RDP'
        required: true
        type: string
      password:
        description: 'Password RDP'
        required: true
        type: string

jobs:
  setup-rdp:
    runs-on: windows-latest # Anda bisa mengubahnya ke ubuntu-latest jika diperlukan

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Proses Konfigurasi Input
        run: |
          echo "Username berhasil diterima: ${{ github.event.inputs.user }}"
          # Variabel di bawah ini bisa digunakan untuk skrip instalasi Tailscale/RDP Anda
        env:
          TAILSCALE_KEY: ${{ github.event.inputs.tailscale_key }}
          RDP_USER: ${{ github.event.inputs.user }}
          RDP_PASS: ${{ github.event.inputs.password }}
